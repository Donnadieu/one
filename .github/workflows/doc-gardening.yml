name: doc-gardening
# Goal: pay documentation debt down continuously, not only when a human
# happens to run a harness-engineering pass (see tools/doc-gardening.py for
# the full rationale — this is the right-sized, Swift-repo equivalent of
# Forge's harness-engineering skill's "doc-gardening" artifact).
#
# Runs --fix on a schedule, and opens a small PR only when the tree
# actually changed. Never auto-merges: Omar is this repo's single
# maintainer and wants to see what a bot changed before it lands, same as
# any other PR.
on:
  schedule:
    - cron: '17 13 * * 1'  # Monday mornings (9:17am New York / 13:17 UTC)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  # `gh workflow run` below needs this. An explicit permissions block zeroes every scope it doesn't
  # name, so without it the dispatch 403s and the job goes red AFTER the pull request is open.
  actions: write

jobs:
  garden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run doc-gardening --fix
        id: fix
        run: |
          set +e
          python3 tools/doc-gardening.py --fix > /tmp/doc-gardening-report.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/doc-gardening-report.txt
          # The step used to end on `cat`, so its exit status was always 0: a SyntaxError, a missing
          # import or any traceback was indistinguishable from "found judgment-call issues", and the
          # workflow went green every Monday while opening no PR. 0 = clean, 1 = findings; anything
          # above that is the script itself being broken.
          if [ "$code" -gt 1 ]; then
            echo "✗ tools/doc-gardening.py exited $code, which is not a finding — it didn't run."
            exit "$code"
          fi

      - name: Check whether anything changed
        id: diff
        # Scoped to the same paths the PR step stages. `git status --porcelain` with no paths said
        # "changed" for any dirty file, so a fix that only touched something outside add-paths set
        # changed=true, create-pull-request found nothing to commit, exited 0, opened no PR — and the
        # workflow was green with the fix silently discarded.
        run: |
          if git status --porcelain -- docs AGENTS.md README.md | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          if git status --porcelain | grep -qv -e '^.. docs/' -e '^.. AGENTS.md' -e '^.. README.md'; then
            echo "✗ --fix changed a file outside docs/, AGENTS.md and README.md, which the PR step won't stage:"
            git status --porcelain | grep -v -e '^.. docs/' -e '^.. AGENTS.md' -e '^.. README.md'
            echo "    FIX: either --fix shouldn't touch it, or add it to add-paths below."
            exit 1
          fi

      - name: Open a PR with the mechanical fixes
        if: steps.diff.outputs.changed == 'true'
        # Pinned to a commit, not the v6 tag: a tag on someone else's repo can be moved to new
        # code after you reviewed it, and this step holds contents+pull-requests write.
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c  # v6.1.0
        with:
          commit-message: "doc-gardening: automated fixes"
          title: "doc-gardening: automated fixes"
          body-path: /tmp/doc-gardening-report.txt
          branch: doc-gardening/automated-fixes
          delete-branch: true
          add-paths: |
            docs/**
            AGENTS.md
            README.md

      # GitHub raises no workflow_run for an event made with GITHUB_TOKEN, so the PR above arrived
      # with no checks at all: "same as any other PR" minus the gate. Run the rules on the branch the
      # bot just pushed, so the branch is red before Omar reads it rather than after it lands.
      - name: Run the rules on the branch the bot pushed
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rules.yml --ref doc-gardening/automated-fixes

      - name: Report findings left for a human, even with no file changes
        if: steps.diff.outputs.changed == 'false' && steps.fix.outputs.exit_code != '0'
        run: |
          echo "doc-gardening found judgment-call issues that need a human look (no mechanical fix was possible — nothing to open a PR for):"
          cat /tmp/doc-gardening-report.txt
          # Red, not green: a scheduled run whose findings nobody can see in the Actions list is a
          # run nobody reads. The finding is in the log above.
          exit 1
