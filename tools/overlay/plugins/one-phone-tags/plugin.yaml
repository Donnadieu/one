name: one-phone-tags
version: "1.0.0"
description: "One: helper lines work in the phone chat too. A reply there with [helper: …], [tell-helper: …], [stop-helper: …] or [done-helper: …] is handed to One on the Mac (which starts, tells, stops or clears the helper exactly as in its own chat, shows it there and messages the result back when it's done); the person never sees the raw lines. Each phone turn also tells the assistant how its helpers are doing."
author: "One (Donnadieu/one)"
provides_hooks:
  - transform_llm_output
  - pre_llm_call
