name: fresh-install
# Goal: a brand-new person's first launch, on a clean Mac (a GitHub runner), never on the owner's Mac.
# Installs the pinned engine into an empty One folder (`--install-test`, install only), then runs One's first-launch
# steps on an empty test brain (`--test-first-launch`) and checks everything in the storage design's section 3c
# appears with no questions. A stand-in `git` first on PATH records every call: the brain steps must make none.
# Branch and tag pushes build One with a stand-in brain starter (the real one is a private repo);
# a published release is tested as shipped: its own One.zip, which carries the real starter.
on:
  push:
    tags: ['v*']
    branches: ['release-*']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read   # checkout, and `gh release download` on a published release
concurrency:
  group: fresh-install-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  fresh:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        if: github.event_name != 'release'
        run: |
          X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
      - name: Build (stand-in brain starter)
        if: github.event_name != 'release'
        env:
          ONE_FAST_BUILD: '1'
        run: |
          BS="$RUNNER_TEMP/brain-starter"
          cp -R tests/fixtures/brain-starter-min "$BS"
          git -C "$BS" init -q && git -C "$BS" add -A && git -C "$BS" -c user.name=ci -c user.email=ci@localhost commit -qm starter
          BRAIN_STARTER="$BS" ./build.sh
      - name: The released app, as shipped
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          # A tag name may contain a double quote, so it goes through env: and never into the run line.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$TAG" -p One.zip -D "$RUNNER_TEMP/rel"
          mkdir -p build/app.noindex
          ditto -x -k "$RUNNER_TEMP/rel/One.zip" build/app.noindex
          test -d build/app.noindex/One.app/Contents/Resources/brain-starter
      - name: The bundled brain starter has no third-party kit material (no templates/cofounder-room, kit.yaml, frameworks)
        run: python3 tools/brain-starter-bundle.py check build/app.noindex/One.app/Contents/Resources/brain-starter
      - name: Install the engine into an empty One folder
        run: |
          APP=$(tools/test-copy.sh fresh "$RUNNER_TEMP/app")
          echo "TBIN=$APP/Contents/MacOS/One" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/fresh" "$RUNNER_TEMP/cloud"
          cd "$RUNNER_TEMP/fresh"
          ONE_SUPPORT_DIR="$RUNNER_TEMP/fresh" ONE_INSTALL_ONLY=1 perl -e 'alarm 1200; exec @ARGV' "$APP/Contents/MacOS/One" --install-test | tee install.txt
          grep -q "^install: ok" install.txt
          # The four assertions that used to sit in a `[ $CI = 0 ] && [ $FULL = 1 ]` block in
          # tools/preflight.sh, which no venue could reach: it installed into the empty folder and
          # nothing checked WHAT it installed.
          grep -q "hermes: $RUNNER_TEMP/fresh" install.txt
          test "$(git -C "$RUNNER_TEMP/fresh/engine" rev-parse HEAD)" = "$(cat "$APP/Contents/Resources/hermes-commit.txt")"
          grep -q KeePassLoginBackend "$RUNNER_TEMP/fresh/engine/agent/vault_backends/base.py"
          test -x "$RUNNER_TEMP/fresh/tools-venv/bin/python"
      - name: The real engine loads the learning cap and holds the review's 6th edit
        run: ONE_SUPPORT_DIR="$RUNNER_TEMP/fresh" tools/learning-cap-engine-check.sh
      - name: Standing goals through the real engine (stand-in model)
        run: ONE_SUPPORT_DIR="$RUNNER_TEMP/fresh" tools/goal-engine-check.sh
      - name: "Routines through the real engine (stand-in model): a quiet reply is cut off within the idle limit, the same turn runs again once the AI answers, work kept"
        run: ONE_SUPPORT_DIR="$RUNNER_TEMP/fresh" tools/routine-stall-check.sh
        if: false  # probe only: its engine probe breaks the engine venv for every later step (v0.9.148 tag run too)
      - name: "Hand-offs on pages that exist only in their tab (make handoff): a code from One's card lands in that same tab, a step done in the page is shown live, nothing reopened"
        timeout-minutes: 15
        run: ONE_SUPPORT_DIR="$RUNNER_TEMP/fresh" tools/handoff-check.sh --no-build
      - name: The real engine answers recent phone messages and lists old ones (one-missed-messages)
        run: ONE_SUPPORT_DIR="$RUNNER_TEMP/fresh" tools/missed-messages-engine-check.sh
      # Was named only on a `[ $CI = 0 ]` line in tools/preflight.sh, which every venue runs with
      # --ci: so the plugin-level check passed while nothing proved the real engine LOADS the guard.
      - name: The real engine loads the browser guard and blocks a visible browser
        run: ONE_SUPPORT_DIR="$RUNNER_TEMP/fresh" tools/browser-guard-engine-check.sh
      - name: The real engine's Telegram adapter turns a reply's choices line into tap buttons (one-phone-tags)
        run: ONE_SUPPORT_DIR="$RUNNER_TEMP/fresh" tools/phone-choices-engine-check.sh
      - name: "The real engine never tells a person their turn 'will not be run again'; a phone message a restart cut goes again exactly once (one-restart-replay)"
        run: ONE_SUPPORT_DIR="$RUNNER_TEMP/fresh" tools/restart-replay-engine-check.sh
      - name: Other AIs and thinking levels through the real engine (its list, a key saved its way, levels for chats, helpers and routines)
        run: |
          cd "$RUNNER_TEMP/fresh"
          ONE_SUPPORT_DIR="$RUNNER_TEMP/fresh" perl -e 'alarm 300; exec @ARGV' "$TBIN" --test-other-ais-engine | tee other-ais.txt
          grep -q "^other ais engine ok" other-ais.txt
      - name: First launch on an empty brain (no questions, no git)
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          printf '#!/bin/bash\necho "git $*" >> "%s"\nexit 1\n' "$RUNNER_TEMP/git.log" > "$RUNNER_TEMP/fakebin/git"
          chmod +x "$RUNNER_TEMP/fakebin/git"
          : > "$RUNNER_TEMP/git.log"
          cd "$RUNNER_TEMP/fresh"
          PATH="$RUNNER_TEMP/fakebin:$PATH" ONE_GIT_LOG="$RUNNER_TEMP/git.log" ONE_SUPPORT_DIR="$RUNNER_TEMP/fresh" \
            ONE_CLOUD_DIR="$RUNNER_TEMP/cloud" perl -e 'alarm 600; exec @ARGV' "$TBIN" --test-first-launch | tee first.txt
          grep -q "^first launch ok" first.txt
