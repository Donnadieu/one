name: check
# Goal: a pull request's check is green (or red) within 3 minutes of the push.
#  - Every pull request that touches code, every push to main, every release tag and every night: every
#    check in tools/preflight.sh, split into 4 parts that run side by side on their own runners (the
#    matrix below; the split is in preflight.sh, `part N` lines).
#  - NOT nothing-skipped, and this file used to claim it was: a docs-only pull request skips this
#    workflow entirely (paths-ignore below). That is why `rules` and not `check` is the required
#    status check on main — a required check that a pull request skips never reports, and the pull
#    request then waits for a status that will never arrive.
#  - Each part builds the app itself, unoptimized and incremental (ONE_BUILD_CACHE): the compiled files of an earlier
#    run come back from the cache, so only the files a change touched compile again.
#  - Formatting runs in part 1 (it needs macOS). Every other fast rule runs in rules.yml instead, on
#    every pull request with no paths-ignore: this workflow skips docs-only changes, and until PER-33
#    that skipped the identity, lint and docs checks with it.
#  - A newer push to the same pull request or branch cancels the older run, so stale runs never hold a runner.
#  - Every check has its own time limit and each part stops at 10 minutes: a stuck check can't block the line for hours.
on:
  # No path filter on a push: a merge into main and a release tag both get the full check. A tag is
  # the last moment to catch a regression before fresh-install.yml publishes, and path filtering a
  # newly created tag has no before/after to diff against, so what it would do is unspecified.
  # The filter stays on pull_request, which is where the waste was (building One four ways to read a
  # changed paragraph).
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths-ignore: ['*.md', 'docs/**', 'LICENSE', '.agents/**']
  schedule:
    - cron: '17 7 * * *'  # nightly run (3:17 am New York)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  # Only for a pull request: on main, two merges in quick succession would cancel the first and
  # leave a commit on main with no check result at all.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    name: check (part ${{ matrix.part }})
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]  # same count as PARTS in tools/preflight.sh. 4, not more: the account runs at most 5 macOS jobs at once
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: "${{ matrix.part == 1 && '0' || '1' }}" }
      - name: Use the newest Xcode on the runner
        id: xcode
        run: |
          X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          swiftc --version
          echo "key=$ImageOS-$(basename "$X" .app)-$(swiftc --version 2>&1 | head -1 | md5 | cut -c1-8)" >> "$GITHUB_OUTPUT"
      - name: Apple's framework modules from the last run
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/swift-module-cache
          key: swift-modules-${{ steps.xcode.outputs.key }}
      - name: One's compiled files from an earlier run (only changed files compile again)
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/one-build-cache
          key: one-build-${{ steps.xcode.outputs.key }}-${{ github.sha }}
          restore-keys: one-build-${{ steps.xcode.outputs.key }}-
      # The rest of the fast rules (identity, One's own rules, the baseline, doc drift, the
      # knowledge base, ruff and shellcheck) live in rules.yml, which has no paths-ignore and so runs
      # on a docs-only pull request too. Formatting stays here because it needs macOS (xcrun).
      - name: Formatting
        if: matrix.part == 1
        run: xcrun swift-format lint -r -s -p Sources
      - name: Chrome opens through the Mac's launcher without its first-open check (the hidden-browser check needs it)
        run: |
          xattr -l "/Applications/Google Chrome.app" | cut -c1-120 || true
          sudo xattr -dr com.apple.quarantine "/Applications/Google Chrome.app" || true
      - name: Preflight part ${{ matrix.part }} (no login needed)
        env:
          ONE_FAST_BUILD: '1'
          ONE_BUILD_CACHE: ${{ runner.temp }}/one-build-cache
          ONE_MODULE_CACHE: ${{ runner.temp }}/swift-module-cache
          ONE_SHOT_DIR: ${{ runner.temp }}/one-shots
        run: tools/preflight.sh --ci --part ${{ matrix.part }}
      - name: Keep the compiled files for the next run
        if: always() && matrix.part == 1
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/one-build-cache
          key: one-build-${{ steps.xcode.outputs.key }}-${{ github.sha }}
      - name: Pictures the checks took (a helper's orb before and after a restart)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: 'check-pictures-part-${{ matrix.part }}', path: '${{ runner.temp }}/one-shots', if-no-files-found: ignore }
