name: preflight
on:
  push:
    branches: [main]
  pull_request:
jobs:
  preflight:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          swiftc --version
      - name: Preflight (no login needed)
        run: tools/preflight.sh --ci
